---
rae:
  vars:
    ansible_user: root
    # 00-config-dump.yml and 01-network-setup.yml select the USB address.
    # Subsequent playbooks use the hostname registered in local DNS.
    ansible_host: "{{ inventory_hostname }}.lan"
    # Factory reset regenerates SSH host keys.
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    # Wi-Fi network for RAE to join. When empty, the playbook asks for it.
    wifi_ssid: ""
  hosts:
    rae-alpha:
      usb_address: 192.168.198.55
      usb_host_address: 192.168.198.54
    rae-beta:
      usb_address: 192.168.199.55
      usb_host_address: 192.168.199.54
